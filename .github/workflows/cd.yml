name: CD - Deploy to Azure

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "auth-api", path: "./auth-api" }
          - { name: "todos-api", path: "./todos-api" }
          - { name: "users-api", path: "./users-api" }
          - { name: "frontend", path: "./frontend" }
          - { name: "log-message-processor", path: "./log-message-processor" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} #azure service principal:)

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service.name }}:${{ inputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate and Check AZURE_CREDENTIALS
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "AZURE_CREDENTIALS is not defined."
            exit 1
          fi

          CREDS='${{ secrets.AZURE_CREDENTIALS }}'
          if ! echo "$CREDS" | jq empty 2>/dev/null; then
            echo "AZURE_CREDENTIALS is not valid JSON"
            exit 1
          fi

          CLIENT_ID=$(echo "$CREDS" | jq -r '.clientId // empty')
          TENANT_ID=$(echo "$CREDS" | jq -r '.tenantId // empty')
          CLIENT_SECRET=$(echo "$CREDS" | jq -r '.clientSecret // empty')
          SUBSCRIPTION_ID=$(echo "$CREDS" | jq -r '.subscriptionId // empty')

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            echo "Missing required fields in AZURE_CREDENTIALS"
            echo "clientId: ${CLIENT_ID:+present}"
            echo "tenantId: ${TENANT_ID:+present}"
            echo "clientSecret: ${CLIENT_SECRET:+present}"
            echo "subscriptionId: ${SUBSCRIPTION_ID:+present}"
            exit 1
          fi

          echo "AZURE_CREDENTIALS is defined and valid. All required fields are present."
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Create .tfvars file for deployment
        run: |
          IMAGE_TAG=${{ inputs.sha }}
          SUB_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)

          echo "subscription_id = \"$SUB_ID\"" > terraform/container-apps/terraform.tfvars
          echo "image_tags = {" >> terraform/container-apps/terraform.tfvars
          echo "  \"auth-api\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"todos-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"users-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"frontend\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"log-message-processor\" = \"$IMAGE_TAG\"" >> terraform/container-apps/terraform.tfvars
          echo "}" >> terraform/container-apps/terraform.tfvars
        shell: bash

      - name: Run Terraform to deploy Container Apps
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          bash ./terraform/scripts/deploy-container-apps.sh terraform/container-apps/terraform.tfvars
        shell: bash

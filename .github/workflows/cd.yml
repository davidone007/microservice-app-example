name: CD - Deploy to Azure

on:
  workflow_run:
    workflows: ["CI - Build, Test, and Push Docker Images"]
    types:
      - completed
    branches:
      - main
      - develop
      - ops/feature/pipelines

jobs:
  build-and-push:
    # Este job solo se ejecuta si el workflow de CI fue exitoso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: 'auth-api', path: './auth-api' }
          - { name: 'todos-api', path: './todos-api' }
          - { name: 'users-api', path: './users-api' }
          - { name: 'frontend', path: './frontend' }
          - { name: 'log-message-processor', path: './log-message-processor' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Necesitamos hacer fetch del commit específico que disparó el CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Create .tfvars file for deployment
        run: |
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          SUB_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)

          echo "subscription_id = \"$SUB_ID\"" > terraform/container-apps/terraform.tfvars
          echo "image_tags = {" >> terraform/container-apps/terraform.tfvars
          echo "  \"auth-api\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"todos-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"users-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"frontend\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"log-message-processor\" = \"$IMAGE_TAG\"" >> terraform/container-apps/terraform.tfvars
          echo "}" >> terraform/container-apps/terraform.tfvars
        shell: bash

      - name: Run Terraform to deploy Container Apps
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          bash ./terraform/scripts/deploy-container-apps.sh terraform/container-apps/terraform.tfvars
        shell: bash
name: CD - Deploy to Azure

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "auth-api", path: "./auth-api" }
          - { name: "todos-api", path: "./todos-api" }
          - { name: "users-api", path: "./users-api" }
          - { name: "frontend", path: "./frontend" }
          - { name: "log-message-processor", path: "./log-message-processor" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} #azure service principal

      - name: Verify AZURE_CREDENTIALS (masked)
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${AZ_CREDS:-}" ]; then
            echo "AZURE_CREDENTIALS is not set"
            exit 1
          fi
          python3 - <<'PY'
          import os, json
          creds = os.environ.get('AZ_CREDS')
          try:
              j = json.loads(creds)
          except Exception as e:
              print('Failed to parse AZURE_CREDENTIALS as JSON:', e)
              raise SystemExit(1)
          def mask(s):
              s = str(s)
              if len(s) <= 8:
                  return '*' * max(0, len(s)-2) + s[-2:]
              return '*' * (len(s)-4) + s[-4:]
          print('keys:', ','.join(sorted(j.keys())))
          print('clientId:', mask(j.get('clientId','')))
          print('tenantId:', mask(j.get('tenantId','')))
          print('subscriptionId:', mask(j.get('subscriptionId','')))
          PY

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service.name }}:${{ inputs.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify AZURE_CREDENTIALS (masked)
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${AZ_CREDS:-}" ]; then
            echo "AZURE_CREDENTIALS is not set"
            exit 1
          fi
          python3 - <<'PY'
import os, json
creds = os.environ.get('AZ_CREDS')
try:
    j = json.loads(creds)
except Exception as e:
    print('Failed to parse AZURE_CREDENTIALS as JSON:', e)
    raise SystemExit(1)
def mask(s):
    s = str(s)
    if len(s) <= 8:
        return '*' * max(0, len(s)-2) + s[-2:]
    return '*' * (len(s)-4) + s[-4:]
print('keys:', ','.join(sorted(j.keys())))
print('clientId:', mask(j.get('clientId','')))
print('tenantId:', mask(j.get('tenantId','')))
print('subscriptionId:', mask(j.get('subscriptionId','')))
PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Create .tfvars file for deployment
        run: |
          IMAGE_TAG=${{ inputs.sha }}
          SUB_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)

          echo "subscription_id = \"$SUB_ID\"" > terraform/container-apps/terraform.tfvars
          echo "image_tags = {" >> terraform/container-apps/terraform.tfvars
          echo "  \"auth-api\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"todos-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"users-api\"             = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"frontend\"              = \"$IMAGE_TAG\"," >> terraform/container-apps/terraform.tfvars
          echo "  \"log-message-processor\" = \"$IMAGE_TAG\"" >> terraform/container-apps/terraform.tfvars
          echo "}" >> terraform/container-apps/terraform.tfvars
        shell: bash

      - name: Run Terraform to deploy Container Apps
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          bash ./terraform/scripts/deploy-container-apps.sh terraform/container-apps/terraform.tfvars
        shell: bash

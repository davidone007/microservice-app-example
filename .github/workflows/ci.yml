name: CI - Build, Test, and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
      - ops/feature/pipelines
  pull_request:
    branches:
      - main
      - develop
      - ops/feature/pipelines
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-api
            path: ./auth-api
            tech: go
          - name: todos-api
            path: ./todos-api
            tech: node
          - name: users-api
            path: ./users-api
            tech: java
          - name: frontend
            path: ./frontend
            tech: node
          - name: log-message-processor
            path: ./log-message-processor
            tech: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Go Steps
      - name: Set up Go
        if: matrix.service.tech == 'go'
        uses: actions/setup-go@v3
        with:
          go-version: '1.19'

      - name: Install Go dep
        if: matrix.service.tech == 'go'
        run: go install github.com/golang/dep/cmd/dep@latest

      - name: Go - Install dependencies
        if: matrix.service.tech == 'go'
        run: dep ensure
        working-directory: ${{ matrix.service.path }}

      - name: Go - Run tests
        if: matrix.service.tech == 'go'
        run: go test -v ./...
        working-directory: ${{ matrix.service.path }}

      # Node.js Steps
      - name: Set up Node.js
        if: matrix.service.tech == 'node'
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Node - Install dependencies
        if: matrix.service.tech == 'node'
        run: npm install
        working-directory: ${{ matrix.service.path }}

      # Java/Maven Steps
      - name: Set up JDK and Maven
        if: matrix.service.tech == 'java'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Skipping Java tests as they require additional configuration
      - name: Java - Build without tests
        if: matrix.service.tech == 'java'
        run: mvn -B clean package -DskipTests
        working-directory: ${{ matrix.service.path }}

      # Python Steps
      - name: Set up Python
        if: matrix.service.tech == 'python'
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Python - Install dependencies
        if: matrix.service.tech == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ matrix.service.path }}
      
      # Docker build steps (for all services)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: false # Only build, don't push yet
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ github.sha }}

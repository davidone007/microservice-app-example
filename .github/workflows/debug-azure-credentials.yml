name: Debug Azure Credentials (temporary)

on:
  workflow_dispatch:

jobs:
  inspect-azure-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no code needed)
        uses: actions/checkout@v4

      - name: Print masked AZURE_CREDENTIALS keys
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${AZ_CREDS:-}" ]; then
            echo "AZURE_CREDENTIALS secret is empty or not set"
            exit 1
          fi
          echo "Parsing AZURE_CREDENTIALS..."
          python3 - <<'PY'
            import json, os
            creds = os.environ.get('AZ_CREDS')
            try:
                j = json.loads(creds)
            except Exception as e:
                print('Failed to parse AZURE_CREDENTIALS as JSON:', e)
                raise SystemExit(1)

            def mask(v):
                s = str(v)
                if len(s) <= 8:
                    return '*' * max(0, len(s)-2) + s[-2:]
                return '*' * (len(s)-4) + s[-4:]

            for k in sorted(j.keys()):
                print(f'{k}: {mask(j[k])}')
            print('\nYou should see keys like clientId, tenantId, subscriptionId, clientSecret.')
            PY

services:
  # Base de datos Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: usersuser
      POSTGRES_PASSWORD: userspass
    ports:
      - "5432:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "usersuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Users API (Java Spring Boot)
  users-api:
    build: ./users-api
    ports:
      - "8083:8083"
    environment:
      - JWT_SECRET=PRFT
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/usersdb
      - SPRING_DATASOURCE_USERNAME=usersuser
      - SPRING_DATASOURCE_PASSWORD=userspass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - microservices-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 8083 | grep LISTEN"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth API (Go)
  auth-api:
    build: ./auth-api
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=PRFT
      - AUTH_API_PORT=8000
      - USERS_API_ADDRESS=http://users-api:8083
    networks:
      - microservices-network
    depends_on:
      users-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/version",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # TODOs API (Node.js)
  todos-api:
    build: ./todos-api
    ports:
      - "8082:8082"
    environment:
      - JWT_SECRET=PRFT
      - TODO_API_PORT=8082
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=log_channel
    networks:
      - microservices-network
    depends_on:
      redis:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 8082 | grep LISTEN"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Log Message Processor (Python)
  log-processor:
    build: ./log-message-processor
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=log_channel
      - PYTHONUNBUFFERED=1
    networks:
      - microservices-network
    depends_on:
      redis:
        condition: service_healthy

  # Frontend (Vue.js)
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_API_ADDRESS=http://auth-api:8000
      - TODOS_API_ADDRESS=http://todos-api:8082
    networks:
      - microservices-network
    depends_on:
      auth-api:
        condition: service_healthy
      todos-api:
        condition: service_healthy

networks:
  microservices-network:
    driver: bridge
